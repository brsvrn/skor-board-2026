<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#ececec">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" type="image/png" href="/api/icon?s=192&amp;v=2">
<link rel="apple-touch-icon" href="/api/icon?s=180&amp;v=2">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Tribün">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="description" content="Tribün: futbol ve basketbol canlı skorları, istatistik, kadro ve puan durumu.">
<title>Tribün · Canlı Skor</title>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<script>try{const pref=JSON.parse(localStorage.getItem('tribun')||'{}').theme;const t=['light','dark','system'].includes(pref)?pref:'system';document.documentElement.dataset.theme=t;document.querySelector('meta[name="theme-color"]').content=t==='dark'||t==='system'&&matchMedia('(prefers-color-scheme: dark)').matches?'#121620':'#ececec'}catch(e){}</script>
<script>try{if(matchMedia('(display-mode: standalone)').matches||navigator.standalone){document.documentElement.classList.add('pwa');var t=JSON.parse(localStorage.getItem('tribun')||'{}');if(!t.seen){t.seen=1;localStorage.setItem('tribun',JSON.stringify(t))}}}catch(e){}</script>
<style>#boot{display:none;position:fixed;inset:0;z-index:50;background:var(--bg);color:var(--ink);flex-direction:column;padding:calc(16px + env(safe-area-inset-top,0px)) 16px calc(26px + env(safe-area-inset-bottom,0px));transition:opacity .4s ease}html.pwa #boot{display:flex}#boot.out{opacity:0;pointer-events:none}#boot>*{width:100%;max-width:448px;margin-left:auto;margin-right:auto}#boot .bl{height:4px;border-radius:9px;background:var(--bar-bg);overflow:hidden;margin-top:18px}#boot .bl i{display:block;height:100%;width:40%;border-radius:9px;background:var(--bar-a);animation:bl 1.1s ease-in-out infinite}@keyframes bl{0%{transform:translateX(-100%)}100%{transform:translateX(250%)}}@media(prefers-reduced-motion:reduce){#boot .bl i{animation:none;width:100%}}</style>

</head>
<body>
<div id="app"></div>
<div id="boot" class="v22-boot" aria-hidden="true"><div class="poster v22-poster"><div class="v22-stadium" aria-hidden="true"></div><div class="v22-brand"><span class="v22-eyebrow"><i></i> CANLI SKOR</span><strong>TRİBÜN</strong><span class="v22-sports">FUTBOL <i></i> BASKETBOL</span></div><img class="v22-balls" src="/icons/splash-balls.svg" alt="Futbol ve basketbol topları" width="800" height="680"><div class="v22-poster-foot"><span>MAÇIN HER ANI</span><span>TEK YERDE</span></div></div><div class="slogan"><b>Maç senin. Tribün senin.</b><span>Canlı skorlar yükleniyor…</span></div><div class="bl"><i></i></div></div>

<script src="history.js"></script>
<script src="push.js"></script>
<script src="projection.js"></script>
<script src="app.js"></script>
<script src="install.js"></script>
</body>
</html>
